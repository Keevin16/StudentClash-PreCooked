<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pythagoras · Professor sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="/"><span class="brand-icon">g<span>✳</span></span><span class="brand-word">pythagoras<span class="brand-dot">.</span></span><span class="brand-tag">AI oral assessment</span></a>
  </div></header>
  <main style="display:grid;place-items:center">
    <div class="card" style="width:100%;max-width:420px;margin-top:40px">
      <div class="eyebrow">Professor area</div>
      <h2>Sign in</h2>
      <p class="muted small">Manage assignments and read the AI assessment reports.</p>
      <form id="login-form">
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" autofocus required>
        </div>
        <div id="login-error" class="notice error hidden" style="margin-bottom:14px"></div>
        <button class="btn primary block" id="login-btn" type="submit">Sign in</button>
      </form>
    </div>
  </main>
  <footer class="site"><a href="/">← Student page</a></footer>
  <script src="/static/app.js"></script>
  <script src="/static/prof-login.js"></script>
</body>
</html>
